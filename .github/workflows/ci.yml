name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Validate all shipping translations
        run: |
          python3 -m unittest discover -s Tests -p '*Tests.py'
          python3 scripts/check-localizations.py
      - name: App and VibeBar tests
        run: >-
          xcodebuild -project "AhaKey Studio.xcodeproj" -scheme "AhaKey Studio"
          -configuration Debug -destination "platform=macOS,arch=$(uname -m)"
          -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult -testLanguage en
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual test
      - name: Localization tests in other shipping languages
        run: |
          for language in $(python3 scripts/check-localizations.py --languages); do
            [[ "$language" == en ]] && continue
            xcodebuild -project "AhaKey Studio.xcodeproj" -scheme "AhaKey Studio" \
              -configuration Debug -destination "platform=macOS,arch=$(uname -m)" \
              -derivedDataPath DerivedData -resultBundlePath "TestResults-$language.xcresult" \
              -testLanguage "$language" -only-testing:"AhaKey StudioTests/LocalizationTests" \
              -only-testing:"AhaKey StudioTests/OLEDLocalizationTests" \
              CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual test
          done
      - name: Build examples
        run: |
          for scheme in Plugin PluginShowcase VibeBarSmoke SocketServer Client; do
            xcodebuild -project "AhaKey Studio.xcodeproj" -scheme "$scheme" \
              -configuration Debug -destination "platform=macOS,arch=$(uname -m)" \
              -derivedDataPath DerivedData CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build
          done
      - name: Build universal Release app
        run: >-
          xcodebuild -project "AhaKey Studio.xcodeproj" -scheme "AhaKey Studio"
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath DerivedData ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build
      - name: Verify and zip development build
        run: |
          app='DerivedData/Build/Products/Release/AhaKey Studio.app'
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/AhaKeyConfig" -verify_arch arm64 x86_64
          lipo "$app/Contents/MacOS/ahakeyconfig-agent" -verify_arch arm64 x86_64
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/AhaKey-Studio-macOS-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AhaKey-Studio-development
          path: dist/AhaKey-Studio-macOS-development.zip
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: 'TestResults*.xcresult'
          if-no-files-found: ignore

  typescript-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
